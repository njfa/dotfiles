# tmux起動時のシェルをzshにする
set -g default-shell $SHELL

# Escキーの遅延を解消
set -g escape-time 0

# nvimのcheckhealthでWARNINGが出ていたため追加
set -g focus-events on

set -g history-limit 30000

# ssh先でもクリップボードのコピー結果を連携できるよう、OSC 52を利用するようにする
set-option -s set-clipboard on

# yaziで画像をプレビューするために追記
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# vimが起動しているかを判定する
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

###########################################################
# 外観
###########################################################

# tmuxを256色表示できるようにする
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",$TERM:Tc"

# Undercurl
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# Check if we are in WSL
if-shell 'test -n "$WSL_DISTRO_NAME"' {
  set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m' # underscore colours - needs tmux-3.0 (wsl2 in Windows Terminal)
}

# message text（可読性向上のため太字を追加）
set-option -g message-style bg="#4fd6be",fg="#141B2E,bold"

############################
# ステータスバー
############################

# ステータスバー
## ステータスバーをトップに配置する
set -g status-position top

# ウィンドウ番号の左寄せ
set -g status-justify left

# ステータスバーを描画し直さない
set -g status-interval 0

# ウィンドウのインデックスを1から開始
set -g base-index 1

# ペインのインデックスを1から開始
setw -g pane-base-index 1

# ステータスバーの色を設定する
set -g status-fg "#ffffff"
set -g status-bg "#141B2E"

# アクティビティ/ベルを検知する
set -g monitor-activity on
set -g monitor-bell on

# 同期モードとコピーモードのインジケーターを追加
set -g status-right '#[fg=#00BFFF,bold]#{?pane_synchronized,⚡SYNC #[fg=#00FFFF]┊,}#[fg=#4fd6be,bold]#{?window_zoomed_flag, 󰊓 ZOOM #[fg=#00FFFF]┊,}#[fg=#FF8C00,bold]#{?pane_in_mode,📋 COPY #[fg=#00FFFF]┊,}#[fg=#ffffff bold] #(date "+%Y/%m/%d %H:%M") #[fg=#00FFFF]┊#[fg=#ffffff] #(date "+%a")  #[fg=#ffffff,bg=#141B2E]#[default]'

# ステータスバー左/右のサイズ
set -g status-left-length 40
set -g status-right-length 120

# 表示内容
set -g status-left '#S #[fg=#00FFFF]┊ '

# ウィンドウ表示（/でセグメント化）
setw -g window-status-format "#[fg=#{?window_bell_flag,#141B2E,#{?window_activity_flag,#141B2E,#3B4261}},bg=#{?window_bell_flag,#EE9EA1,#{?window_activity_flag,#A0BFFF,#141B2E}}]#[fg=#{?window_bell_flag,#EE9EA1,#{?window_activity_flag,#A0BFFF,#141B2E}},bg=#{?window_bell_flag,#141B2E,#{?window_activity_flag,#141B2E,#3B4261}}] #I:#W #[fg=#{?window_bell_flag,#141B2E,#{?window_activity_flag,#141B2E,#3B4261}},bg=#{?window_bell_flag,#EE9EA1,#{?window_activity_flag,#A0BFFF,#141B2E}}]#[default]"

# アクティブウィンドウを強調
setw -g window-status-current-format "#[fg=#4fd6be,bg=#141B2E]#[fg=#141B2E,bg=#4fd6be,bold] #I:#W #[fg=#4fd6be,bg=#141B2E]#[default]"

############################
# ペイン
############################

# 非アクティブなペインは背景色を変える（コントラスト向上のため暗く）
set -g window-style 'bg=#0D1117'
set -g window-active-style 'bg=#141B2E'

# アクティブペインの境界線をより明るく目立つ色に変更
set -g pane-active-border-style "fg=#4fd6be,bg=#141B2E"
set -g pane-border-style "fg=#737aa2,bg=#141B2E"

# ペイン毎のステータス表示
set -g pane-border-status bottom
# ペインステータスをより簡潔で視認性の高い表示に変更
set -g pane-border-format "#[fg=#4fd6be,bold]#{?pane_active,▶ ,  }#[fg=#ffffff]#{pane_current_command}#{?#{==:#{pane_current_command},ssh}, → #(tmux-get-hostname.sh #{pane_current_command} #{pane_pid}),}  "
# set -g pane-border-format "#(tmux-pane-border.sh #{pane_current_path} #{pane_current_command} #{pane_pid})"

###########################################################
# キーバインド (normal mode)
###########################################################

# prefixキーをC-oに変更
set -g prefix C-o

# C-bのキーバインドを解除
unbind C-b

# r で設定をリロード
bind r 'source-file ~/.config/tmux/tmux.conf; display " Reload config! (~/.config/tmux/.tmux.conf)"'

# ウィンドウを作成
bind -n 'M-c' new-window -c "#{pane_current_path}"
bind -n 'M-q' 'detach-client'

# x でペインをkill
bind -r x kill-pane
bind -n M-x kill-pane

# ウィンドウ移動
bind -r n 'next-window'
bind -r p 'previous-window'
bind -n M-n 'next-window'
bind -n M-b 'previous-window'

# vimのキーバインドでペインを移動する
bind -n M-h 'select-pane -L'
bind -n M-j 'select-pane -D'
bind -n M-k 'select-pane -U'
bind -n M-l 'select-pane -R'
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# ウィンドウ一覧
bind w 'choose-tree -s'

# ペインの分割
bind e split-window -h -c "#{pane_current_path}"
bind i split-window -v -c "#{pane_current_path}"
bind -n M-e split-window -h -c "#{pane_current_path}"
bind -n M-i split-window -v -c "#{pane_current_path}"

# マウス操作を有効にする
set -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"
bind a setw synchronize-panes \; display "synchronize-panes #{?pane_synchronized,on,off}"
bind -n M-a setw synchronize-panes \; display "synchronize-panes #{?pane_synchronized,on,off}"

# ペインをダブルクリックで最大化/復元
bind -n DoubleClick1Pane run-shell 'if [ "#{window_zoomed_flag}" = "1" ]; then tmux resize-pane -Z; else tmux resize-pane -Z; fi'

# 中央クリックでメニューを表示（より使用頻度の高い項目を上部に配置）
unbind -n MouseDown2Pane
bind -n MouseDown2Pane      display-menu -T "#[align=centre]#{window_index}:#{window_name}" -t = -x W -y S \
  "#{?window_zoomed_flag,Unzoom,Zoom}"  z "resize-pane -Z"                                   \
  "#{?pane_marked,Unmark,Mark}"         m "select-pane -m"                                   \
  ""                                                                                         \
  "Split Horizontal"                    h "split-window -h"                                  \
  "Split Vertical"                      v "split-window -v"                                  \
  ""                                                                                         \
  "Swap Left"                           l "swap-window -t:-1"                                \
  "Swap Right"                          r "swap-window -t:+1"                                \
  "#{?pane_marked_set,,-}Swap Marked"   s swap-window                                        \
  ""                                                                                         \
  Kill                                  X kill-window                                        \
  Rename                                n "command-prompt -I \"#W\" \"rename-window -- '%%'\""

###########################################################
# キーバインド (copy mode)
###########################################################

# コピーモードでvimキーバインドを使う
setw -g mode-keys vi

# prefix + vでコピーモード
bind v copy-mode \; display "Copy mode!"
bind -n M-v copy-mode \; display "Copy mode!"

# 'v' で選択を始める
bind -T copy-mode-vi v send -X begin-selection

# 'V' で行選択
bind -T copy-mode-vi V send -X select-line

# 'C-v' で矩形選択
bind -T copy-mode-vi C-v send -X rectangle-toggle

# 'y' で選択範囲をコピー（コピーモード継続）
bind -T copy-mode-vi y send -X copy-selection

# Enter で選択範囲をコピーして終了
bind -T copy-mode-vi Enter send -X copy-selection-and-cancel

# Escapeでコピーモードを終了
bind -T copy-mode-vi Escape send-keys -X cancel

# キーバインドの割り当てを解除
unbind -n MouseDown3Pane

###########################################################
# 追加の便利なショートカット
###########################################################

# ペインの入れ替え（swap-pane）
bind -n M-o swap-pane -D
bind -n M-O swap-pane -U

# ポップアップ起動（トグル）
bind -n M-t run-shell "$HOME/.dotfiles/bin/tmuxpopup shell"
bind -n M-g run-shell "$HOME/.dotfiles/bin/tmuxpopup lazygit lazygit"
bind -n M-d run-shell "$HOME/.dotfiles/bin/tmuxpopup lazydocker lazydocker"
bind -n M-s run-shell "$HOME/.dotfiles/bin/tmux-git-wt"
bind -n M-f resize-pane -Z

###########################################################
# Plugins (TPM)
###########################################################

set -g @plugin 'tmux-plugins/tpm'
set -g @session-switcher-bind-kill 'ctrl-x'
set -g @session-switcher-bind-rename 'ctrl-r'
set -g @session-switcher-bind-reload 'ctrl-l'
set -g @session-switcher-bind-toggle-preview '?'
set -g @session-switcher-preview-location 'top'
set -g @session-switcher-preview-size '50%'
set -g @session-switcher-window-width '100%'
set -g @session-switcher-window-height '100%'
set -g @session-switcher-fzf-builtin-tmux 'off'
bind -n M-w run-shell "tmux-session-switcher"

run '~/.tmux/plugins/tpm/tpm'
