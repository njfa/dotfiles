name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-ubuntu-latest:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: change permission
      run: chmod +x bin/de
    - name: Run de contract test
      run: bash tests/devenv-contract.sh
    - name: Run focused shell tests
      run: |
        bash tests/mise-config.sh
        bash tests/chezmoiignore.sh
        bash tests/dependencies-skip-without-privilege.sh
        bash tests/rustup-skip-without-writable-home.sh
        bash tests/sudo-required-tasks-skip-without-sudo.sh
        bash tests/tmux-tui-window.sh
        bash tests/tmux-win32yank-wsl.sh
        bash tests/tmux-osc52-clipboard.sh
        bash tests/wsl-xdg-open.sh
        bash tests/yazi-keymap.sh
        bash tests/dashlane-cli-install.sh
        bash tests/orca-server-install.sh
    - name: Validate shell syntax
      run: bash -n $(git ls-files '*.sh' 'bin/de')
    - name: Validate mise tasks
      run: DOTFILES_PATH="$PWD" MISE_CONFIG_FILE="$PWD/dot_config/mise/config.toml" bin/de m tasks validate
    - name: Initialize dotfiles
      run: bin/de
    - name: Deploy dotfiles
      run: bin/de m run deploy

  build-ubuntu-22_04:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
    - name: change permission
      run: chmod +x bin/de
    - name: Run de contract test
      run: bash tests/devenv-contract.sh
    - name: Run focused shell tests
      run: |
        bash tests/mise-config.sh
        bash tests/chezmoiignore.sh
        bash tests/dependencies-skip-without-privilege.sh
        bash tests/rustup-skip-without-writable-home.sh
        bash tests/sudo-required-tasks-skip-without-sudo.sh
        bash tests/tmux-tui-window.sh
        bash tests/tmux-win32yank-wsl.sh
        bash tests/tmux-osc52-clipboard.sh
        bash tests/wsl-xdg-open.sh
        bash tests/yazi-keymap.sh
        bash tests/dashlane-cli-install.sh
        bash tests/orca-server-install.sh
    - name: Validate shell syntax
      run: bash -n $(git ls-files '*.sh' 'bin/de')
    - name: Validate mise tasks
      run: DOTFILES_PATH="$PWD" MISE_CONFIG_FILE="$PWD/dot_config/mise/config.toml" bin/de m tasks validate
    - name: Initialize dotfiles
      run: bin/de
    - name: Deploy dotfiles
      run: bin/de m run deploy

  build-ubuntu-24_04:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
    - name: change permission
      run: chmod +x bin/de
    - name: Run de contract test
      run: bash tests/devenv-contract.sh
    - name: Run focused shell tests
      run: |
        bash tests/mise-config.sh
        bash tests/chezmoiignore.sh
        bash tests/dependencies-skip-without-privilege.sh
        bash tests/rustup-skip-without-writable-home.sh
        bash tests/sudo-required-tasks-skip-without-sudo.sh
        bash tests/tmux-tui-window.sh
        bash tests/tmux-win32yank-wsl.sh
        bash tests/tmux-osc52-clipboard.sh
        bash tests/wsl-xdg-open.sh
        bash tests/yazi-keymap.sh
        bash tests/dashlane-cli-install.sh
        bash tests/orca-server-install.sh
    - name: Validate shell syntax
      run: bash -n $(git ls-files '*.sh' 'bin/de')
    - name: Validate mise tasks
      run: DOTFILES_PATH="$PWD" MISE_CONFIG_FILE="$PWD/dot_config/mise/config.toml" bin/de m tasks validate
    - name: Initialize dotfiles
      run: bin/de
    - name: Deploy dotfiles
      run: bin/de m run deploy

  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: init
      run: bin/setup.ps1 init
      env:
        DOTFILES_USE_PROXY: n
    - name: terminal
      run: bin/setup.ps1 terminal
    - name: vscode
      run: bin/setup.ps1 vscode
    - name: wslconfig
      run: bin/setup.ps1 wslconfig
    - name: tools
      run: bin/setup.ps1 tools
      env:
        DOTFILES_USE_PROXY: n
    # - name: fonts
    #   run: bin/setup.ps1 fonts
    #   env:
    #     DOTFILES_USE_PROXY: n
    - name: nvim
      run: bin/setup.ps1 nvim
    - name: profile
      run: bin/setup.ps1 profile
