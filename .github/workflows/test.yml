name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-ubuntu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: change permission
      run: chmod +x bin/de
    - name: Run shell tests and syntax checks
      run: bash tests/run.sh
    - name: Validate mise tasks
      run: DOTFILES_PATH="$PWD" MISE_CONFIG_FILE="$PWD/dot_config/mise/config.toml" bin/de m tasks validate
    - name: Initialize dotfiles
      run: bin/de
    - name: Deploy dotfiles
      run: bin/de m run deploy

  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Test Windows setup
      run: pwsh -NoProfile -File tests/windows-setup.ps1
    - name: Test Windows PowerShell compatibility
      run: powershell -NoProfile -File tests/windows-setup.ps1
    - name: init
      run: bin/setup.ps1 init
      env:
        DOTFILES_USE_PROXY: n
    - name: terminal
      run: bin/setup.ps1 terminal
    - name: vscode
      run: bin/setup.ps1 vscode
    - name: wslconfig
      run: bin/setup.ps1 wslconfig
    - name: tools
      run: bin/setup.ps1 tools
      env:
        DOTFILES_USE_PROXY: n
    # - name: fonts
    #   run: bin/setup.ps1 fonts
    #   env:
    #     DOTFILES_USE_PROXY: n
    - name: nvim
      run: bin/setup.ps1 nvim
    - name: profile
      run: bin/setup.ps1 profile
