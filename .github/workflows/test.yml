name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-ubuntu-latest:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: change permission
      run: chmod +x bin/devenv
    - name: Run devenv contract test
      run: bash tests/devenv-contract.sh
    - name: Run focused shell tests
      run: bash tests/mise-config.sh && bash tests/dependencies-skip-without-privilege.sh && bash tests/rustup-skip-without-writable-home.sh
    - name: Validate shell syntax
      run: bash -n bin/devenv etc/os/ubuntu/init/dependencies.sh tests/devenv-contract.sh
    - name: Validate mise tasks
      run: DOTFILES_PATH="$PWD" MISE_CONFIG_FILE="$PWD/dot_config/mise/config.toml" bin/devenv mise tasks validate
    - name: Initialize dotfiles
      run: bin/devenv
    - name: Deploy dotfiles
      run: bin/devenv mise run deploy

  build-ubuntu-22_04:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
    - name: change permission
      run: chmod +x bin/devenv
    - name: Run devenv contract test
      run: bash tests/devenv-contract.sh
    - name: Run focused shell tests
      run: bash tests/mise-config.sh && bash tests/dependencies-skip-without-privilege.sh && bash tests/rustup-skip-without-writable-home.sh
    - name: Validate shell syntax
      run: bash -n bin/devenv etc/os/ubuntu/init/dependencies.sh tests/devenv-contract.sh
    - name: Validate mise tasks
      run: DOTFILES_PATH="$PWD" MISE_CONFIG_FILE="$PWD/dot_config/mise/config.toml" bin/devenv mise tasks validate
    - name: Initialize dotfiles
      run: bin/devenv
    - name: Deploy dotfiles
      run: bin/devenv mise run deploy

  build-ubuntu-24_04:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
    - name: change permission
      run: chmod +x bin/devenv
    - name: Run devenv contract test
      run: bash tests/devenv-contract.sh
    - name: Run focused shell tests
      run: bash tests/mise-config.sh && bash tests/dependencies-skip-without-privilege.sh && bash tests/rustup-skip-without-writable-home.sh
    - name: Validate shell syntax
      run: bash -n bin/devenv etc/os/ubuntu/init/dependencies.sh tests/devenv-contract.sh
    - name: Validate mise tasks
      run: DOTFILES_PATH="$PWD" MISE_CONFIG_FILE="$PWD/dot_config/mise/config.toml" bin/devenv mise tasks validate
    - name: Initialize dotfiles
      run: bin/devenv
    - name: Deploy dotfiles
      run: bin/devenv mise run deploy

  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: init
      run: bin/setup.ps1 init
      env:
        DOTFILES_USE_PROXY: n
    - name: terminal
      run: bin/setup.ps1 terminal
    - name: vscode
      run: bin/setup.ps1 vscode
    - name: wslconfig
      run: bin/setup.ps1 wslconfig
    - name: tools
      run: bin/setup.ps1 tools
      env:
        DOTFILES_USE_PROXY: n
    # - name: fonts
    #   run: bin/setup.ps1 fonts
    #   env:
    #     DOTFILES_USE_PROXY: n
    - name: nvim
      run: bin/setup.ps1 nvim
    - name: profile
      run: bin/setup.ps1 profile
