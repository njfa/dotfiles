[tasks.psql]
run = "sudo apt-get update -y && sudo apt-get install -y postgresql-client"

[tasks.mysql]
run = "sudo apt-get update -y && sudo apt-get install -y mysql-client"

[tasks.rustup]
run = '''bash -lc 'set -euo pipefail
if command -v cargo >/dev/null 2>&1; then
  exit 0
fi

rustup_home=${RUSTUP_HOME:-"$HOME/.rustup"}
cargo_home=${CARGO_HOME:-"$HOME/.cargo"}
rustup_parent=$(dirname "$rustup_home")
cargo_parent=$(dirname "$cargo_home")

if { [ -e "$rustup_home" ] && [ ! -w "$rustup_home" ]; } || { [ ! -e "$rustup_home" ] && [ ! -w "$rustup_parent" ]; } || { [ -e "$cargo_home" ] && [ ! -w "$cargo_home" ]; } || { [ ! -e "$cargo_home" ] && [ ! -w "$cargo_parent" ]; }; then
  echo "Skipping rustup: RUSTUP_HOME or CARGO_HOME is not writable." >&2
  exit 0
fi

export RUSTUP_HOME="$rustup_home"
export CARGO_HOME="$cargo_home"
curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y'
'''

[tasks.dashlane-cli]
run = '''bash -lc 'set -euo pipefail
: "${DOTFILES_PATH:?DOTFILES_PATH is required}"
cd "$DOTFILES_PATH"
bash etc/os/ubuntu/opt/dashlane-cli.sh'
'''

[tasks.homebrew]
run = '''bash -lc 'set -euo pipefail
bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"'
'''
