[tools]
# Versions are pinned here so setup does not depend on .env.
python = "3.13.11"

# Runtimes / CLIs (keep versions explicit so they can be overridden)
node = "lts"
go = "latest"
terraform = "latest"

# CLI tools managed via mise (plugins may be required)
fzf = "latest"
lazygit = "latest"
lazydocker = "latest"
ripgrep = "latest"
fd = "latest"
bat = "latest"
terraform-docs = "latest"
"pipx:pre-commit" = "latest"
jq = "latest"
yq = "latest"
delta = "latest"
neovim = "0.12"
uv = "latest"
"npm:tree-sitter-cli" = "latest"

yazi = "latest"
zoxide = "latest"
eza = "latest"
chezmoi = "latest"

"ubi:gitlab-org/cli" = { version = "latest", exe = "glab", provider = "gitlab" }

[tasks.os-dependencies]
quiet = true
run = "bash -lc 'set -euo pipefail; : \"${DOTFILES_PATH:?DOTFILES_PATH is required}\"; test -f \"$DOTFILES_PATH/dot_config/mise/config.toml\"; test -x \"$DOTFILES_PATH/bin/de\"; cd \"$DOTFILES_PATH\"; bash etc/os/ubuntu/init/dependencies.sh'"

[tasks.setup]
depends = ["os-dependencies"]
run = [
  "mise run default"
]

[tasks.deploy]
run = [
  '''bash -lc 'set -euo pipefail
: "${DOTFILES_PATH:?DOTFILES_PATH is required}"
test -f "$DOTFILES_PATH/dot_config/mise/config.toml"
test -x "$DOTFILES_PATH/bin/de"
mise install chezmoi >/dev/null
mise exec chezmoi -- chezmoi apply --source "$DOTFILES_PATH"

agents_path=${AGENTS_PATH:-"$HOME/.agents"}
if [ -d "$agents_path" ]; then
  test -f "$agents_path/.chezmoiignore"
  mise exec chezmoi -- chezmoi apply --source "$agents_path"
fi

if [ -f "$DOTFILES_PATH/wsl.conf" ]; then
  if [ "$(id -u)" -eq 0 ]; then
    cp "$DOTFILES_PATH/wsl.conf" /etc/wsl.conf
  elif command -v sudo >/dev/null 2>&1 && { sudo -n true >/dev/null 2>&1 || { [ -t 0 ] && sudo -v >/dev/null 2>&1; }; }; then
    sudo cp "$DOTFILES_PATH/wsl.conf" /etc/wsl.conf
  else
    echo "Skipping wsl.conf deployment: sudo is unavailable or unusable in this session." >&2
  fi
fi'
''',
  "git config --global core.editor vim",
  "git config --global core.autoCRLF false"
]

[tasks.sync-to-windows]
run = '''bash -lc 'set -euo pipefail
: "${DOTFILES_PATH:?DOTFILES_PATH is required}"
test -f "$DOTFILES_PATH/dot_config/mise/config.toml"
test -x "$DOTFILES_PATH/bin/de"
windows_home=/mnt/c/Users/${USER:-}
if [ ! -d "$windows_home" ]; then
  if [ -n "${USERPROFILE:-}" ]; then
    windows_home=$(printf "%s" "$USERPROFILE" | sed "s|\\\\|/|g" | sed "s|^C:|/mnt/c|")
  else
    echo "Windows home directory not found. Please ensure you are running in WSL." >&2
    exit 1
  fi
fi
test -d "$windows_home"
target="$windows_home/$(basename "$DOTFILES_PATH")"
mkdir -p "$target"
rsync -av --delete --exclude=.git "$DOTFILES_PATH/" "$target/"'
'''

[tasks.list]
run = [
  "mise ls",
  '''bash -lc 'set -euo pipefail
: "${DOTFILES_PATH:?DOTFILES_PATH is required}"
test -f "$DOTFILES_PATH/dot_config/mise/config.toml"
test -x "$DOTFILES_PATH/bin/de"
mise install chezmoi >/dev/null
mise exec chezmoi -- chezmoi managed --source "$DOTFILES_PATH"
agents_path=${AGENTS_PATH:-"$HOME/.agents"}
if [ -d "$agents_path" ]; then
  test -f "$agents_path/.chezmoiignore"
  mise exec chezmoi -- chezmoi managed --source "$agents_path"
fi'
'''
]

[tasks.git-config]
run = [
  "git config --global core.pager delta",
  "git config --global interactive.diffFilter \"delta --color-only\"",
  "git config --global delta.side-by-side true",
  "git config --global delta.line-numbers true",
  "git config --global delta.navigate true",
  "git config --global delta.light false",
  "git config --global delta.true-color always",
  "git config --global delta.syntax-theme Dracula",
  "git config --global merge.conflictstyle diff3",
  "git config --global diff.colorMoved default",
  "git config --global wt.basedir \".worktrees\"",
  "git config --global wt.copyuntracked true",
  "git config --global wt.copymodified true",
  "git config --global wt.copyignored true",
  "git config --global --replace-all wt.nocopy \"tmp/\"",
  "git config --global --add wt.nocopy \"*.log\""
]

[tasks.default]
run = [
  "mise run apm",
  "mise run rustup",
  "mise run git-config",
  "mise run tpm",
  "mise run mdformat",
  "mise run git-wt",
  "mise run zsh",
  "mise run tmux",
  "mise run sdkman",
  "mise run connect",
  "mise run xdg-open",
  "mise run win32yank",
  "mise run docker",
  "mise run node-tools",
  "mise run neovim"
]

[tasks.optional]
run = [
  "mise run zellij",
  "mise run cargo-tools"
]

[tasks.apm]
run = [
  "curl -sSL https://aka.ms/apm-unix | sh"
]

[tasks.node-tools]
# Global npm tools
run = ["npm install -g typescript"]

[tasks.neovim]
run = [
  "mise install neovim uv ripgrep fd",
  "uv tool install pynvim",
  "uv tool install neovim-remote",
  "uv tool install isort"
]

[tasks.neovim-clean]
run = "rm -rf $HOME/.cache/nvim $HOME/.local/state/nvim"

[tasks.cargo-tools]
# Cargo-based utilities not covered by mise plugins yet
run = ["bash -lc 'set -euo pipefail; if [ -f \"$HOME/.cargo/env\" ]; then . \"$HOME/.cargo/env\"; fi; cargo install cargo-binstall tokei'"]

[tasks.zjstatus]
# Zellij plugin used by existing config
run = [
  "mkdir -p $HOME/.local/share/zellij/plugins",
  "curl -fL -o $HOME/.local/share/zellij/plugins/zjstatus.wasm https://github.com/dj95/zjstatus/releases/latest/download/zjstatus.wasm"
]

[tasks.zellij]
run = [
  "mise install zellij",
  "mise run zjstatus"
]

[tasks.tpm]
run = '''bash -lc 'set -euo pipefail
: "${DOTFILES_PATH:?DOTFILES_PATH is required}"
cd "$DOTFILES_PATH"
